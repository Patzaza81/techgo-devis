<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TechGo Devis">
<title>TechGo Devis</title>
<style>
:root{--teal:#0b7a8c;--teal-d:#075a68;--gold:#e0a100;--ink:#1d2b30;--mut:#5d6f75;--line:#dbe4e7;--bg:#f4f8f9;--ok:#1f8a4c;--warn:#b7791f;--bad:#c0392b;--card:#fff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--teal);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between}
header{justify-content:flex-start;gap:12px}#hlogo{background:#fff;border-radius:9px;padding:3px;flex:none}header b{font-size:18px}header small{opacity:.85}
main{max-width:760px;margin:0 auto;padding:14px}
h2{font-size:20px;margin:6px 0 12px;color:var(--teal-d)}
h3{font-size:15px;margin:18px 0 8px;color:var(--teal-d);text-transform:uppercase;letter-spacing:.03em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:44px}
input:focus,select:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
button{font:inherit;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--teal);background:var(--teal);color:#fff;font-weight:600}
button.sec{background:#fff;color:var(--teal)}
button.gold{background:var(--gold);border-color:var(--gold);color:#222}
button:disabled{opacity:.45}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:8px 2px;border-radius:0;min-height:56px;font-weight:600}
nav button.on{color:var(--teal);box-shadow:inset 0 3px 0 var(--teal)}
nav button span{display:block;font-size:19px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--teal);color:#fff;text-align:left;padding:8px;font-size:12px}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.sub td{font-weight:700;background:#eef5f6}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:700;font-size:13px;color:#fff}
.b-complet{background:var(--ok)}.b-verifier{background:var(--warn)}.b-bloque{background:var(--bad)}
.chk{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.dot{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;text-align:center;font-size:13px;line-height:22px;font-weight:700}
.d-ok{background:var(--ok)}.d-verifier{background:var(--warn)}.d-bloque{background:var(--bad)}
.total{background:var(--teal);color:#fff;border-radius:12px;padding:14px;margin:12px 0}
.total div{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.total .big{font-size:22px}.total .opt{color:#ffd96a}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;background:#fff;color:var(--teal)}.seg button.on{background:var(--teal);color:#fff}
.del{background:none;border:0;color:var(--bad);min-height:32px;padding:4px 8px;font-size:18px}
#doc{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px}
#doc h1{margin:0;color:var(--teal);font-size:26px}
#doc .meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;margin:12px 0;font-size:14px}
#doc .meta b{display:block}
#doc .gt{background:var(--teal);color:#fff;padding:12px;border-radius:6px;margin:12px 0}
.note{font-size:12px;color:var(--mut)}

nav a{flex:1;text-align:center;text-decoration:none;color:var(--mut);font-size:11px;padding:8px 2px;min-height:56px;font-weight:600}
nav a.on{color:var(--teal);box-shadow:inset 0 3px 0 var(--teal)}
nav a span{display:block;font-size:19px}
a{color:var(--teal-d)}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--teal);background:var(--teal);color:#fff;font-weight:600;text-decoration:none}
a.btn.sec{background:#fff;color:var(--teal)}
.back{display:inline-block;margin:2px 0 8px;text-decoration:none;font-weight:600}
.row>div,.row3>div{min-width:0}
.row button,.row a.btn{width:100%}
.chkl{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);margin:12px 0}
.chkl input{width:22px;min-height:22px;height:22px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--mut);text-align:center;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.st{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#e6eef0;color:var(--teal-d)}
.st-accepte{background:#d6efe0;color:#14693a}.st-refuse,.st-annule,.st-expire{background:#f6dcd8;color:#8e2a1e}.st-envoye,.st-negociation{background:#fbeccb;color:#7a5200}.st-pret{background:#d6ecf0}
.qcard{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;text-decoration:none;color:var(--ink)}
.qcard.arch{opacity:.55}
.qtop,.qbot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qbot{margin-top:6px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.steps a{flex:none;display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--mut);font-size:13px;font-weight:600;white-space:nowrap}
.steps a i{font-style:normal;background:var(--line);border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;font-size:11px}
.steps a.on{background:var(--teal);color:#fff;border-color:var(--teal)}.steps a.on i{background:#fff;color:var(--teal)}
.banner{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.banner.warn{background:#fff1cc;color:#6b4200}.chip{background:#fff;color:var(--teal);border:2px solid var(--teal);min-height:44px;padding:8px 14px;border-radius:12px;font-size:16px}.chip.on{background:var(--teal);color:#fff}.seg.tabs4{flex-wrap:wrap}.seg.tabs4 button{min-height:48px;font-size:15px}
.banner.info{background:#e3f1f4;color:var(--teal-d)}.banner.bad{background:#f8dedb;color:#8e2a1e}
.lcard{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fff}
.lcard.warn{border-color:var(--warn);background:#fffaf0}
.lt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;background:#fbeccb;color:#7a5200;border-radius:99px;padding:1px 8px;font-weight:700}.tag.t2{background:#e3f1f4;color:var(--teal-d)}
.lcalc{font-size:12px;color:var(--mut);margin:4px 0}
.lnums{display:flex;justify-content:space-between;gap:8px;font-size:14px;flex-wrap:wrap}
details{margin-top:8px}summary{color:var(--teal-d);font-weight:600;min-height:32px}
.scroll{overflow-x:auto}
.params{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:420px){.row3{grid-template-columns:1fr 1fr}.params{grid-template-columns:1fr}}
/* document client — modèles : classique, sobre, compact (seule la mise en forme change, jamais un montant) */
#doc{color:#111;font-size:14px;--dc:#0b7a8c}
#doc h1{color:var(--dc)}
#doc .dochead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--dc);padding-bottom:10px}
#doc .dl{display:flex;gap:12px;align-items:center}#doc .dlogo{max-width:120px;max-height:64px;object-fit:contain;flex:none}
#doc .co{font-size:12px;color:var(--mut)}
#doc th{background:var(--dc);color:#fff}
#doc .gt{background:var(--dc);color:#fff}
#doc .draftmark{display:inline-block;border:2px solid var(--bad);color:var(--bad);padding:2px 10px;font-weight:800;transform:rotate(-3deg);margin:6px 0;font-size:14px}
#doc .gl{font-size:15px;font-weight:700;margin:16px 0 6px}
#doc .gt .gl{margin:4px 0;display:flex;justify-content:space-between;gap:10px}
#doc .sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px;min-height:90px}
#doc .docfoot{margin-top:18px;border-top:1px solid var(--line);padding-top:6px;word-break:break-all}
#doc .n{text-align:right;white-space:nowrap}
#doc table{margin:6px 0}
#doc h3{color:var(--dc)}
#doc.tpl-sobre .dochead{border-bottom:1px solid #999}
#doc.tpl-sobre th{background:#fff;color:#111;border-bottom:2px solid var(--dc)}
#doc.tpl-sobre .gt{background:#fff;color:#111;border:2px solid var(--dc)}
#doc.tpl-sobre tr.sub td{background:#f3f3f3}
#doc.tpl-compact{font-size:12px}#doc.tpl-compact h1{font-size:20px}#doc.tpl-compact td,#doc.tpl-compact th{padding:4px 6px}#doc.tpl-compact h3{margin:10px 0 4px;font-size:13px}
.tplprev{display:flex;gap:8px;flex-wrap:wrap}.tplprev label{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-size:15px}.tplprev input{width:20px;min-height:20px;height:20px}
@media print{
  body{background:#fff;padding:0}header,nav,.noprint{display:none!important}
  main{max-width:none;padding:0}#doc{border:0;padding:0}.back,.banner{display:none!important}
  table{page-break-inside:auto}tr{page-break-inside:avoid}
  th,.gt{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
