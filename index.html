<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a8c">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TechGo Devis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>TechGo Devis</title>
<style>
:root{--teal:#0b7a8c;--teal-d:#075a68;--gold:#e0a100;--ink:#14262b;--mut:#4a5d63;--line:#d9e1e3;--bg:#f7f5ef;--card:#ffffff;--field:#ffffff;--ok:#17693a;--ok-bg:#dcf1e4;--warn-bg:#fff1cc;--warn-ink:#6b4200;--warn:#b7791f;--bad:#b3261e;--bad-bg:#f9dedc;--info-bg:#e2f1f4;--on-teal:#ffffff;--hd:#0b7a8c;--on-hd:#ffffff;--navh:68px;--sh:0 1px 2px rgba(20,38,43,.08),0 4px 14px rgba(20,38,43,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--teal:#4fc3d6;--teal-d:#8ad8e5;--gold:#f2b705;--ink:#eef3f4;--mut:#aebfc4;--line:#2b3d42;--bg:#0f1a1d;--card:#16262a;--field:#1c2f34;--ok:#5fd08a;--ok-bg:#16382a;--warn-bg:#3d3210;--warn-ink:#ffd98a;--warn:#f2b705;--bad:#ff8a80;--bad-bg:#3d1c1a;--info-bg:#17343a;--on-teal:#0f1a1d;--hd:#0d3b44;--on-hd:#eef3f4;--sh:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);padding-bottom:calc(var(--navh) + 12px + env(safe-area-inset-bottom))}
header{background:var(--hd);color:var(--on-hd);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px}
#hlogo{background:#fff;border-radius:10px;padding:3px;flex:none}header b{font-size:19px;letter-spacing:.01em}header small{opacity:.9;font-size:14px}
main{max-width:760px;margin:0 auto;padding:16px}
h2{font-size:24px;line-height:1.2;margin:8px 0 14px;color:var(--teal-d);font-weight:700;text-wrap:balance}
h3{font-size:15px;margin:22px 0 8px;color:var(--teal-d);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
label{display:block;font-size:15px;font-weight:600;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--field);color:var(--ink);min-height:52px}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--teal) 45%,transparent);border-color:var(--teal)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hint{font-size:15px;color:var(--mut);margin-top:8px}
button{font:inherit;font-weight:700;min-height:52px;padding:12px 18px;border-radius:14px;border:2px solid var(--teal);background:var(--teal);color:var(--on-teal);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
button:active{transform:scale(.98)}
button.sec{background:transparent;color:var(--teal-d)}
button.gold{background:var(--gold);border-color:var(--gold);color:#14262b}
button:disabled{opacity:.4}
.ic{flex:none}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;text-decoration:none;color:var(--mut);font-size:12px;padding:6px 2px;height:var(--navh);font-weight:700;white-space:nowrap}
nav a.on{color:var(--teal-d);box-shadow:inset 0 3px 0 var(--teal)}
nav a span{display:block}
table{width:100%;border-collapse:collapse;font-size:15px}
th{background:var(--teal);color:var(--on-teal);text-align:left;padding:10px 8px;font-size:14px}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.sub td{font-weight:700;background:var(--info-bg)}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px;color:#fff}
.b-complet{background:var(--ok)}.b-verifier{background:var(--warn);color:#14262b}.b-bloque{background:var(--bad)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b-complet,:root:not([data-theme="light"]) .b-bloque{color:#0f1a1d}}
.chk{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.dot{flex:none;width:26px;height:26px;border-radius:50%;color:#fff;text-align:center;font-size:15px;line-height:26px;font-weight:800}
.d-ok{background:var(--ok)}.d-verifier{background:var(--warn);color:#14262b}.d-bloque{background:var(--bad)}
.total{background:var(--teal);color:var(--on-teal);border-radius:16px;padding:16px;margin:14px 0}
.total div{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.total .big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}.total .opt{color:var(--gold);margin-top:4px}
.seg{display:flex;gap:8px;margin-bottom:14px}.seg button{flex:1;background:var(--card);color:var(--teal-d)}.seg button.on{background:var(--teal);color:var(--on-teal)}
.del{background:none;border:0;color:var(--bad);min-height:44px;padding:4px 10px;font-size:22px}
.note{font-size:14px;color:var(--mut)}
a{color:var(--teal-d)}
a.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:14px;border:2px solid var(--teal);background:var(--teal);color:var(--on-teal);font-weight:700;text-decoration:none}
a.btn.sec{background:transparent;color:var(--teal-d)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin:0 0 4px;text-decoration:none;font-weight:700}
.row>div,.row3>div{min-width:0}
.row button,.row a.btn{width:100%}
.chkl{display:flex;align-items:center;gap:12px;font-size:17px;color:var(--ink);margin:14px 0;font-weight:500}
.chkl input{width:26px;min-height:26px;height:26px;flex:none}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:22px;color:var(--mut);text-align:center;margin:14px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.st{display:inline-block;padding:3px 11px;border-radius:99px;font-size:14px;font-weight:700;background:var(--info-bg);color:var(--teal-d)}
.st-accepte{background:var(--ok-bg);color:var(--ok)}.st-refuse,.st-annule,.st-expire{background:var(--bad-bg);color:var(--bad)}.st-envoye,.st-negociation{background:var(--warn-bg);color:var(--warn-ink)}
.qcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;text-decoration:none;color:var(--ink);box-shadow:var(--sh)}
.qcard.arch{opacity:.55}
.qtop,.qbot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qbot{margin-top:8px;font-variant-numeric:tabular-nums}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 10px;flex-wrap:wrap}
/* progression */
.prog{margin:6px 0 16px}
.progtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}.progtop b{font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}.progtop span{font-size:20px;font-weight:800;color:var(--teal-d)}
.bar{height:8px;border-radius:99px;background:var(--line);margin:8px 0 10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .25s}
.dots{display:flex;gap:8px}.dots a{flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);color:var(--mut);text-decoration:none;font-weight:800}
.dots a.on{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}.dots a.done{color:var(--ok);border-color:var(--ok)}
/* barre d'action fixe : retour, total, continuer */
.actbar{position:sticky;bottom:calc(var(--navh) + env(safe-area-inset-bottom));margin:16px -16px 0;padding:8px 16px;background:var(--card);border-top:2px solid var(--line);box-shadow:0 -6px 18px rgba(20,38,43,.1);z-index:4}
.actbar .acts{display:flex;gap:10px;align-items:center}
.actbar .tot{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;font-variant-numeric:tabular-nums}.actbar .tot span{font-size:13px;color:var(--mut);font-weight:700}.actbar .tot b{font-size:19px;font-weight:800;white-space:nowrap}
.actbar .go{min-height:56px;font-size:18px;padding:0 18px;flex:none}.actbar .sq{width:52px;min-height:56px;padding:0;flex:none}
.actbar .miss1{margin-top:6px;font-size:14px;font-weight:700;color:var(--warn-ink);background:var(--warn-bg);border-radius:10px;padding:4px 10px;display:flex;align-items:center;gap:6px}
/* états */
.banner{border-radius:14px;padding:12px 14px;margin:12px 0;font-size:16px;border-left:6px solid transparent}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink);border-left-color:var(--warn)}
.banner.info{background:var(--info-bg);color:var(--teal-d);border-left-color:var(--teal)}.banner.bad{background:var(--bad-bg);color:var(--bad);border-left-color:var(--bad)}
.chip{background:var(--card);color:var(--teal-d);border:2px solid var(--teal);min-height:52px;padding:8px 16px;border-radius:14px;font-size:17px}.chip.on{background:var(--teal);color:var(--on-teal)}
.seg.tabs4{flex-wrap:wrap}.seg.tabs4 button{flex:1 1 44%;min-height:52px;font-size:15px;padding:8px 10px;text-align:left}
.lcard{border:1.5px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;background:var(--card)}
.lcard.warn{border-color:var(--warn);border-left-width:6px;background:var(--warn-bg);color:var(--ink)}
.lt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:18px}
.tag{font-size:13px;background:var(--warn-bg);color:var(--warn-ink);border-radius:99px;padding:2px 10px;font-weight:700}.tag.t2{background:var(--info-bg);color:var(--teal-d)}
.lcalc{font-size:14px;color:var(--mut);margin:4px 0}
.lnums{display:flex;justify-content:space-between;gap:8px;font-size:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.miss{margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);border-left:6px solid var(--warn)}.miss .ic{vertical-align:-4px}
.miss input{background:var(--field)}
details{margin-top:10px}summary{color:var(--teal-d);font-weight:700;min-height:44px;display:flex;align-items:center}
.scroll{overflow-x:auto}
.params{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:420px){.row3{grid-template-columns:1fr 1fr}.params{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}}
/* Accueil guidé (idée reprise du commit a00b909, adaptée au design : texte ≥ 14 px, couleurs par variables) */
.welcome{position:relative;overflow:hidden;background:var(--hd);color:var(--on-hd);border-radius:20px;padding:22px 18px 18px;margin-bottom:16px;box-shadow:var(--sh)}
.welcome::after{content:"";position:absolute;width:170px;height:170px;border:1px solid rgba(255,255,255,.18);border-radius:50%;right:-80px;top:-80px;pointer-events:none}
.welcome-kicker{font-size:14px;font-weight:800;letter-spacing:.1em;color:#ffe19a}
.welcome h2{font-size:26px;color:var(--on-hd);margin:10px 0 8px}
.welcome p{font-size:16px;margin:0 0 14px;max-width:460px;opacity:.95}
.welcome-steps{display:grid;gap:8px;margin:14px 0 18px}
.welcome-steps span{display:flex;align-items:center;gap:10px;font-size:16px}
.welcome-steps b{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.16);color:var(--gold);font-size:15px;flex:none}
.welcome .row{position:relative;z-index:1}
.welcome button{background:var(--gold);border-color:var(--gold);color:#14262b}
.welcome button.sec{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.65);color:var(--on-hd)}
/* document client — modèles : classique, sobre, compact (seule la mise en forme change, jamais un montant) */
#doc{--dc:#0b7a8c;--line:#d9e1e3;--mut:#4a5d63;--ink:#14262b;background:#fff;color:#14262b;border:1px solid #d9e1e3;border-radius:12px;padding:20px;font-size:15px;line-height:1.5;box-shadow:var(--sh)}
#doc h1{margin:14px 0 4px;color:var(--dc);font-size:26px;letter-spacing:.04em;font-weight:800}
#doc .dochead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--dc);padding-bottom:12px;position:relative}
#doc .dochead::after{content:"";position:absolute;left:0;bottom:-8px;width:72px;height:4px;background:#e0a100;border-radius:2px}
#doc .dl{display:flex;gap:14px;align-items:center}#doc .dlogo{max-width:130px;max-height:70px;object-fit:contain;flex:none}
#doc .co{font-size:19px;color:#14262b;display:block}
#doc .meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;margin:20px 0 14px;font-size:15px;padding:14px;background:#f7f5ef;border-radius:10px}
#doc .meta b{display:block;font-size:16px}
#doc .note{font-size:13px;color:#4a5d63}
#doc .gt{background:var(--dc);color:#fff;padding:16px 18px;border-radius:12px;margin:14px 0;border:0}
#doc .gt .gl{margin:4px 0;display:flex;justify-content:space-between;gap:10px;font-size:16px;font-weight:700}
#doc .gt .gb{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
#doc .gt .gold{color:#ffd96a}
#doc h3{margin:22px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--dc);border-left:5px solid #e0a100;padding-left:10px}
#doc table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
#doc th{background:var(--dc);color:#fff;padding:9px 8px;font-size:13px;text-align:left}
#doc td{padding:9px 8px;border-bottom:1px solid #e3e9eb}
#doc td.n,#doc th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
#doc tr:nth-child(even) td{background:#fafcfc}
#doc tr.sub td{font-weight:800;background:#e8f2f4;border-bottom:1px solid #cfdfe2}
#doc .draftmark{display:inline-block;border:2px solid #b3261e;color:#b3261e;padding:2px 10px;font-weight:800;transform:rotate(-3deg);margin:6px 0;font-size:14px;letter-spacing:0}
#doc .sign{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
#doc .sign>div{border:1.5px dashed #9fb3b8;border-radius:10px;padding:12px;min-height:130px}
#doc .docfoot{margin-top:22px;border-top:2px solid var(--dc);padding-top:8px;word-break:break-word;text-align:center}
#doc ul.note{padding-left:20px}
#doc.tpl-sobre .dochead{border-bottom:1px solid #999}#doc.tpl-sobre .dochead::after{display:none}
#doc.tpl-sobre th{background:#fff;color:#111;border-bottom:2px solid var(--dc)}
#doc.tpl-sobre .gt{background:#fff;color:#111;border:2px solid var(--dc)}#doc.tpl-sobre .gt .gold{color:#8a6100}
#doc.tpl-sobre tr.sub td{background:#f3f3f3}#doc.tpl-sobre h3{border-left-color:var(--dc)}
#doc.tpl-compact{font-size:12px;padding:14px}#doc.tpl-compact h1{font-size:20px}#doc.tpl-compact td,#doc.tpl-compact th{padding:4px 6px}#doc.tpl-compact h3{margin:12px 0 4px;font-size:12px}#doc.tpl-compact .meta{padding:8px;margin:12px 0 8px}
@media(max-width:480px){#doc{padding:14px;font-size:14px}#doc table{font-size:13px}#doc td,#doc th{padding:7px 5px}#doc .gt .gb{font-size:24px}#doc .sign{grid-template-columns:1fr}}
.tplprev{display:flex;gap:10px;flex-wrap:wrap}.tplprev label{display:flex;align-items:center;gap:8px;margin:0;color:var(--ink);font-size:17px}.tplprev input{width:24px;min-height:24px;height:24px}
@page{size:A4;margin:16mm 14mm}
@media print{
  body{background:#fff;padding:0}header,nav,.noprint,.actbar,.prog{display:none!important}
  main{max-width:none;padding:0}#doc{border:0;padding:0;box-shadow:none;border-radius:0}.back,.banner,.qhead{display:none!important}
  table{page-break-inside:auto}tr{page-break-inside:avoid}h3{page-break-after:avoid}.gt,.sign{page-break-inside:avoid}
  th,.gt,tr.sub td,.dochead,.dochead::after{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header><img id="hlogo" alt="" width="40" height="40"><div><b id="hname">TechGo Devis</b><br><small id="hsub"></small></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script type="module" src="app.js"></script>
</body>
</html>
