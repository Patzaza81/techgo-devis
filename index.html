<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a8c">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TechGo Devis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>TechGo Devis</title>
<style>
:root{--teal:#0b7a8c;--teal-d:#0b6676;--gold:#e0a100;--ink:#16232a;--mut:#69787e;--line:#e7ebed;--bg:#ffffff;--card:#ffffff;--field:#f1f4f5;--ok:#17803f;--ok-bg:#e3f4ea;--warn-bg:#fff4d6;--warn-ink:#6b4200;--warn:#c98a0a;--bad:#b3261e;--bad-bg:#fbe5e3;--info-bg:#e8f3f5;--on-teal:#ffffff;--hd:#ffffff;--on-hd:#16232a;--navh:64px;--sh:0 1px 3px rgba(22,35,42,.06)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);padding-bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom))}
header{background:var(--hd);color:var(--on-hd);padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top));position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
#hlogo{border-radius:9px;flex:none}header b{font-size:18px;font-weight:800}header small{color:var(--mut);font-size:14px}
main{max-width:640px;margin:0 auto;padding:20px}
h2{font-size:26px;line-height:1.2;margin:4px 0 18px;color:var(--ink);font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:14px;margin:28px 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:16px;border:1px solid var(--line);box-shadow:var(--sh)}
label{display:block;font-size:15px;font-weight:600;color:var(--mut);margin:14px 0 6px}
select{-webkit-appearance:none;appearance:none;padding-right:44px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%2369787e' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
input,select,textarea{width:100%;font:inherit;padding:13px 14px;border:2px solid transparent;border-radius:14px;background-color:var(--field);color:var(--ink);min-height:52px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);background-color:var(--card)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hint{font-size:15px;color:var(--mut);margin-top:8px}
button{font:inherit;font-weight:700;min-height:52px;padding:12px 20px;border-radius:14px;border:0;background:var(--teal);color:var(--on-teal);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
button:active{opacity:.85}
button.sec{background:var(--info-bg);color:var(--teal-d)}
button.gold{background:var(--teal);color:var(--on-teal)}
button:disabled{opacity:.35}
.ic{flex:none}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--mut);font-size:12px;height:var(--navh);font-weight:600;white-space:nowrap}
nav a.on{color:var(--teal-d)}nav a.on .ic{stroke-width:2.4}
table{width:100%;border-collapse:collapse;font-size:15px}
th{color:var(--mut);text-align:left;padding:8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--line)}
td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.sub td{font-weight:700}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:700;font-size:14px;background:var(--info-bg);color:var(--teal-d)}
.b-complet{background:var(--ok-bg);color:var(--ok)}.b-verifier{background:var(--warn-bg);color:var(--warn-ink)}.b-bloque{background:var(--bad-bg);color:var(--bad)}
.chk{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.chk:last-child{border-bottom:0}
.dot{flex:none;width:26px;height:26px;border-radius:50%;text-align:center;font-size:15px;line-height:26px;font-weight:800}
.d-ok{background:var(--ok-bg);color:var(--ok)}.d-verifier{background:var(--warn-bg);color:var(--warn-ink)}.d-bloque{background:var(--bad-bg);color:var(--bad)}
.total{background:var(--card);color:var(--ink);border-radius:18px;padding:16px 18px;margin:16px 0;border:1px solid var(--line);box-shadow:var(--sh);border-left:6px solid var(--teal)}
.total div{display:flex;justify-content:space-between;gap:10px;font-weight:600;color:var(--mut)}
.total .big{font-size:26px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}.total .opt{color:var(--warn-ink);margin-top:4px}
.seg{display:flex;gap:6px;margin-bottom:16px;background:var(--line);padding:4px;border-radius:14px}.seg button{flex:1;background:transparent;color:var(--mut);min-height:44px;padding:8px}.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.del{background:none;color:var(--bad);min-height:44px;padding:4px 10px;font-size:22px}
.note{font-size:14px;color:var(--mut)}
a{color:var(--teal-d)}
a.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:14px;background:var(--teal);color:var(--on-teal);font-weight:700;text-decoration:none}
a.btn.sec{background:var(--info-bg);color:var(--teal-d)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;text-decoration:none;font-weight:600;color:var(--mut)}
.row>div,.row3>div{min-width:0}
.row button,.row a.btn{width:100%}
.chkl{display:flex;align-items:center;gap:12px;font-size:17px;color:var(--ink);margin:14px 0;font-weight:500}
.chkl input{width:26px;min-height:26px;height:26px;flex:none}
.empty{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;color:var(--mut);text-align:center;margin:16px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.st{display:inline-block;padding:3px 11px;border-radius:99px;font-size:14px;font-weight:700;background:var(--info-bg);color:var(--teal-d)}
.st-accepte{background:var(--ok-bg);color:var(--ok)}.st-refuse,.st-annule,.st-expire{background:var(--bad-bg);color:var(--bad)}.st-envoye,.st-negociation{background:var(--warn-bg);color:var(--warn-ink)}
.qcard{display:block;background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:12px;text-decoration:none;color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh)}
.qcard.arch{opacity:.55}
.qtop,.qbot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qbot{margin-top:8px;font-variant-numeric:tabular-nums}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px}
/* progression : 5 traits cliquables */
.prog{margin:0 0 18px}
.segs{display:flex;gap:6px}.segs a{flex:1;padding:12px 0;display:block}.segs a i{display:block;height:5px;border-radius:99px;background:var(--line)}
.segs a.done i{background:var(--teal)}.segs a.on i{background:var(--teal);height:7px;margin-top:-1px}
.progtop{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--mut);font-weight:700}.progtop .ref{font-weight:500}
/* bouton fixe unique */
.actbar{position:sticky;bottom:calc(var(--navh) + 10px + env(safe-area-inset-bottom));margin:20px 0 0;z-index:4}
.actbar .acts{display:flex;gap:10px;align-items:stretch}
.actbar .go{flex:1;min-height:58px;font-size:18px;justify-content:space-between;padding:0 20px;box-shadow:0 8px 24px rgba(11,122,140,.35)}
.actbar .go .amt{font-size:15px;font-weight:700;opacity:.92;font-variant-numeric:tabular-nums}
.actbar .sq{width:58px;min-height:58px;padding:0;flex:none;background:var(--card);color:var(--teal-d);box-shadow:0 8px 24px rgba(22,35,42,.14)}
/* états */
.banner{border-radius:14px;padding:12px 14px;margin:14px 0;font-size:16px}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink)}
.banner.info{background:var(--info-bg);color:var(--teal-d)}.banner.bad{background:var(--bad-bg);color:var(--bad)}
.chips.names{max-height:210px;overflow-y:auto}.chip.nm{min-height:44px;font-size:16px;padding:6px 14px}.chip{background:var(--field);color:var(--ink);min-height:48px;padding:8px 16px;border-radius:99px;font-size:17px;font-weight:600}.chip.on{background:var(--teal);color:var(--on-teal)}
.seg.tabs4{flex-wrap:wrap}.seg.tabs4 button{flex:1 1 44%;min-height:48px;font-size:15px;padding:8px 10px}
.seg.tabs4 button .ic{display:none}
.lcard{border-radius:16px;padding:14px 16px;margin:10px 0;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.lcard.warn{background:var(--warn-bg);box-shadow:none}
.lt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:18px}
.tag{font-size:13px;background:var(--warn-bg);color:var(--warn-ink);border-radius:99px;padding:2px 10px;font-weight:700}.tag.t2{background:var(--info-bg);color:var(--teal-d)}
.lcalc{font-size:14px;color:var(--mut);margin:4px 0}
.lnums{display:flex;justify-content:space-between;gap:8px;font-size:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.miss{margin:10px 0;padding:12px;border-radius:14px;background:var(--card);color:var(--warn-ink)}.miss .ic{vertical-align:-4px}
details{margin-top:10px}summary{color:var(--teal-d);font-weight:700;min-height:44px;display:flex;align-items:center}
.scroll{overflow-x:auto}
.params{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.welcome{margin-bottom:16px}.welcome button{font-size:16px;padding:12px 8px;white-space:nowrap}.welcome h2{margin-bottom:14px}
@media(max-width:420px){.row3{grid-template-columns:1fr 1fr}.params{grid-template-columns:1fr}}
/* document client — modèles : classique, sobre, compact (seule la mise en forme change, jamais un montant) */
#doc{--dc:#0b7a8c;--line:#d9e1e3;--mut:#4a5d63;--ink:#14262b;background:#fff;color:#14262b;border:1px solid #d9e1e3;border-radius:12px;padding:20px;font-size:15px;line-height:1.5;box-shadow:var(--sh)}
#doc h1{margin:14px 0 4px;color:var(--dc);font-size:26px;letter-spacing:.04em;font-weight:800}
#doc .dochead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--dc);padding-bottom:12px;position:relative}
#doc .dochead::after{content:"";position:absolute;left:0;bottom:-8px;width:72px;height:4px;background:#e0a100;border-radius:2px}
#doc .dl{display:flex;gap:14px;align-items:center}#doc .dlogo{max-width:130px;max-height:70px;object-fit:contain;flex:none}
#doc .co{font-size:19px;color:#14262b;display:block}
#doc .meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;margin:20px 0 14px;font-size:15px;padding:14px;background:#f7f5ef;border-radius:10px}
#doc .meta b{display:block;font-size:16px}
#doc .note{font-size:13px;color:#4a5d63}
#doc .gt{background:var(--dc);color:#fff;padding:16px 18px;border-radius:12px;margin:14px 0;border:0}
#doc .gt .gl{margin:4px 0;display:flex;justify-content:space-between;gap:10px;font-size:16px;font-weight:700}
#doc .gt .gb{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
#doc .gt .gold{color:#ffd96a}
#doc h3{margin:22px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--dc);border-left:5px solid #e0a100;padding-left:10px}
#doc table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
#doc th{background:var(--dc);color:#fff;padding:9px 8px;font-size:13px;text-align:left}
#doc td{padding:9px 8px;border-bottom:1px solid #e3e9eb}
#doc td.n,#doc th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
#doc tr:nth-child(even) td{background:#fafcfc}
#doc tr.sub td{font-weight:800;background:#e8f2f4;border-bottom:1px solid #cfdfe2}
#doc .draftmark{display:inline-block;border:2px solid #b3261e;color:#b3261e;padding:2px 10px;font-weight:800;transform:rotate(-3deg);margin:6px 0;font-size:14px;letter-spacing:0}
#doc .sign{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
#doc .sign>div{border:1.5px dashed #9fb3b8;border-radius:10px;padding:12px;min-height:130px}
#doc .docfoot{margin-top:22px;border-top:2px solid var(--dc);padding-top:8px;word-break:break-word;text-align:center}
#doc ul.note{padding-left:20px}
#doc.tpl-sobre .dochead{border-bottom:1px solid #999}#doc.tpl-sobre .dochead::after{display:none}
#doc.tpl-sobre th{background:#fff;color:#111;border-bottom:2px solid var(--dc)}
#doc.tpl-sobre .gt{background:#fff;color:#111;border:2px solid var(--dc)}#doc.tpl-sobre .gt .gold{color:#8a6100}
#doc.tpl-sobre tr.sub td{background:#f3f3f3}#doc.tpl-sobre h3{border-left-color:var(--dc)}
#doc.tpl-compact{font-size:12px;padding:14px}#doc.tpl-compact h1{font-size:20px}#doc.tpl-compact td,#doc.tpl-compact th{padding:4px 6px}#doc.tpl-compact h3{margin:12px 0 4px;font-size:12px}#doc.tpl-compact .meta{padding:8px;margin:12px 0 8px}
@media(max-width:480px){#doc{padding:14px;font-size:14px}#doc table{font-size:13px}#doc td,#doc th{padding:7px 5px}#doc .gt .gb{font-size:24px}#doc .sign{grid-template-columns:1fr}}
.tplprev{display:flex;gap:10px;flex-wrap:wrap}.tplprev label{display:flex;align-items:center;gap:8px;margin:0;color:var(--ink);font-size:17px}.tplprev input{width:24px;min-height:24px;height:24px}
@page{size:A4;margin:16mm 14mm}
@media print{
  body{background:#fff;padding:0}header,nav,.noprint,.actbar,.prog{display:none!important}
  main{max-width:none;padding:0}#doc{border:0;padding:0;box-shadow:none;border-radius:0}.back,.banner,.qhead{display:none!important}
  table{page-break-inside:auto}tr{page-break-inside:avoid}h3{page-break-after:avoid}.gt,.sign{page-break-inside:avoid}
  th,.gt,tr.sub td,.dochead,.dochead::after{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header><img id="hlogo" alt="" width="40" height="40"><div><b id="hname">TechGo Devis</b><br><small id="hsub"></small></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script type="module" src="app.js"></script>
</body>
</html>
